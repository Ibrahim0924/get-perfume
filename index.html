    <style>
      /* Critical styles: page colour and a boot placeholder before the app's CSS/JS arrive (slow network, JS off). */
      html { background: #ebe5da; color: #2b2723; }
      html[data-theme='dark'] { background: #1c1b18; color: #e7e0d3; }
      .boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; font: 15px/1.5 Manrope, system-ui, sans-serif; }
      .boot-logo { font: 500 34px/1 'Cormorant Garamond', Georgia, serif; }
      .boot-logo b { color: #9c7a3c; font-weight: 500; }
      .boot-note { opacity: .7; }
      .boot a { color: #9c7a3c; font-weight: 600; }
    </style>
  </head>
  <body>
    <script>
      // Apply the saved/system theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('gerparfume:theme');
          if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
          // Browser chrome (iOS Safari / Android) follows the chosen theme, not just the system one.
          document.querySelector('meta[name="theme-color"]').content = t === 'dark' ? '#1c1b18' : '#ebe5da';
        } catch (e) { document.documentElement.dataset.theme = 'light'; }
      })();
    </script>
    <div id="root">
      <div class="boot">
        <div class="boot-logo">Ger<b>Parfume</b></div>
        <p class="boot-note">Загружаем каталог…</p>
        <noscript>
          <p>Для работы каталога нужен JavaScript. Включите его в настройках браузера<br />или напишите нам в WhatsApp: <a href="https://wa.me/79677775727">8 967 777-57-27</a></p>
        </noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
